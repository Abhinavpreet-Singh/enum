<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealCode - Coding Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #000;
            /* Solid black background */
        }
    </style>
</head>

<body class="text-white min-h-screen relative overflow-x-hidden">

    <!-- Navbar -->
    <nav
        class="fixed top-0 left-0 right-0 z-50 backdrop-blur-xl bg-black/30 border-b border-white/10 px-6 lg:px-12 py-5">
        <div class="max-w-8xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold tracking-tight">RealCode</h1>

            <div class="hidden lg:flex items-center space-x-12 text-sm font-medium tracking-wide uppercase">
                <a href="#" class="hover:text-gray-300 transition-colors">Home</a>
                <a href="#" class="hover:text-gray-300 transition-colors">Features</a>
                <a href="#" class="hover:text-gray-300 transition-colors">How it works</a>
                <a href="#" class="hover:text-gray-300 transition-colors">FAQs</a>
            </div>

            <div class="hidden lg:flex items-center space-x-4">
                <button
                    class="px-6 py-2.5 text-xs border border-white/20 rounded-lg hover:border-white/40 hover:bg-white/5 transition-all">Sign
                    up</button>
                <button
                    class="px-6 py-2.5 text-xs bg-white text-black font-semibold rounded-lg hover:bg-gray-100 transition-all">Log
                    in</button>
            </div>

            <button class="lg:hidden p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="pt-40 pb-28 px-6 lg:px-12 flex items-center justify-center min-h-screen">
        <div class="max-w-3xl mx-auto text-center">

            <h1 class="text-4xl lg:text-5xl font-semibold leading-tight mb-6 tracking-tight">
                Innovative Coding Solutions
            </h1>

            <h2 class="text-4xl lg:text-5xl font-semibold leading-tight mb-10 text-gray-200 tracking-tight">
                Built for Modern Challenges
            </h2>

            <p class="text-base lg:text-lg text-gray-300 max-w-xl mx-auto mb-12 leading-relaxed">
                Focused on delivering scalable and secure software solutions across modern technologies.
            </p>

            <button
                class="px-10 py-4 text-sm font-medium bg-white text-black rounded-xl hover:bg-gray-200 transition-all duration-300 shadow-lg hover:shadow-2xl">
                Get Started
            </button>

        </div>
    </section>

</body>

</html>
